# Full stack on one server: Postgres, one-off migrations, web app, background worker.
# Usage:  cp .env.example .env  (edit secrets)  &&  docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nit_hospital
      POSTGRES_USER: nit_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nit_app -d nit_hospital"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["npx", "tsx", "scripts/migrate.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nit_app:${POSTGRES_PASSWORD}@db:5432/nit_hospital
    depends_on:
      db: { condition: service_healthy }

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nit_app:${POSTGRES_PASSWORD}@db:5432/nit_hospital
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "src/worker/index.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nit_app:${POSTGRES_PASSWORD}@db:5432/nit_hospital
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
